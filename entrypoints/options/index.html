<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>TextareaVim URL設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <img class="brand-mark" src="/icons/48.png" alt="" width="40" height="40" />
        <div class="brand-copy">
          <p class="brand-name">TextareaVim</p>
          <p class="brand-context">URL設定</p>
        </div>
      </div>
    </header>

    <main class="options-page">
      <section class="page-intro" aria-labelledby="page-title">
        <h1 id="page-title">URLの適用範囲</h1>
        <p class="intro">
          サイトごとにTextareaVimを有効にする範囲を指定します。
        </p>
      </section>

      <section class="settings-section" aria-labelledby="settings-title">
        <h2 id="settings-title">URLルール</h2>
        <p class="settings-section-intro">設定を保存すると、開いているページにも反映されます。</p>
        <div id="url-settings-mount"></div>
      </section>
    </main>

    <footer class="page-footer">設定はブラウザの同期ストレージに保存されます。</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
