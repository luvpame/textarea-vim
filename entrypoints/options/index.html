<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>TextareaVim 設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <img class="brand-mark" src="/icons/48.png" alt="" width="40" height="40" />
        <div class="brand-copy">
          <p class="brand-name">TextareaVim</p>
          <p class="brand-context">設定</p>
        </div>
      </div>
    </header>

    <main class="options-page">
      <section class="page-intro" aria-labelledby="page-title">
        <h1 id="page-title">TextareaVim設定</h1>
        <p class="intro">
          拡張機能全体の有効／無効と、サイトごとのTextareaVimの適用範囲を指定します。
        </p>
      </section>

      <section class="settings-section" aria-labelledby="settings-title">
        <h2 id="settings-title">設定</h2>
        <p class="settings-section-intro">
          拡張機能のトグルは変更時に保存され、URLルールは保存すると開いているページにも反映されます。
        </p>
        <div id="url-settings-mount"></div>
      </section>

      <section class="support-section" aria-labelledby="support-title">
        <h2 id="support-title">開発を支援</h2>
        <p class="support-section-intro">
          TextareaVimが役立ったら、Buy Me a Coffeeで開発を支援できます。
        </p>
        <a
          class="support-link"
          href="https://www.buymeacoffee.com/luvpame"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="/images/buy-me-a-coffee.png"
            alt="Buy Me a Coffee"
            width="217"
            height="60"
          />
        </a>
      </section>
    </main>

    <footer class="page-footer">設定はブラウザの同期ストレージに保存されます。</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
