<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TextareaVim URL設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="popup-brand-lockup">
          <img class="popup-brand-mark" src="/icons/32.png" alt="" width="32" height="32" />
          <div>
            <p class="popup-brand-name">TextareaVim</p>
            <h1 id="popup-title">URL設定</h1>
          </div>
        </div>
      </header>

      <section class="popup-settings" aria-label="URL設定フォーム">
        <div id="url-settings-mount"></div>
      </section>

      <button id="open-options" type="button">通常の設定画面を開く</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
