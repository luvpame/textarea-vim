<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TextareaVim 設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="popup-brand-lockup">
          <img class="popup-brand-mark" src="/icons/32.png" alt="" width="32" height="32" />
          <div>
            <p class="popup-brand-name">TextareaVim</p>
            <h1 id="popup-title">設定</h1>
          </div>
        </div>
      </header>

      <section class="popup-settings" aria-label="設定フォーム">
        <div id="url-settings-mount"></div>
      </section>

      <footer class="popup-footer">
        <button id="open-options" type="button">通常の設定画面を開く</button>
        <a
          class="popup-support-link"
          href="https://www.buymeacoffee.com/luvpame"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="/images/buy-me-a-coffee.png"
            alt="Buy Me a Coffee"
            width="217"
            height="60"
          />
        </a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
